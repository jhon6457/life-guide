interface:
  display_name: "减少信息差"
  short_description: "核查当前事实、扩展隐藏选项、比较路线并给出条件化判断"
  default_prompt: "Use $life-guide when a request involves choosing, starting, comparing routes, checking current facts, or finding missing options. In fast mode, clear only route-changing gaps, verify the few claims that could change the answer, and deliver a bounded first judgment. In major-decision mode, expand alternatives, counterevidence, costs, risks, and switch conditions."

policy:
  allow_implicit_invocation: true
